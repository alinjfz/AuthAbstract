services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-authdb}
      POSTGRES_USER:     ${POSTGRES_USER:-authuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-authuser} -d ${POSTGRES_DB:-authdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-authuser}:${DB_PASSWORD}@db:5432/${POSTGRES_DB:-authdb}
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost}
    command: >
      sh -c "alembic upgrade head && gunicorn app:app --bind 0.0.0.0:8000 --workers 2"
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - internal
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    networks:
      - internal
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
